# =====================================================================
# APPLICATION CONFIGURATION - BookMyShow Backend
# =====================================================================

server.port=${SERVER_PORT:8082}

# =====================================================================
# DATABASE CONFIGURATION
# Local dev falls back to localhost MySQL; production sets env vars below.
# =====================================================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bookmyshow?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# =====================================================================
# JPA / HIBERNATE CONFIGURATION
# =====================================================================

# Hibernate DDL: 'update' adds/updates tables to match entities without dropping data
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

# Show SQL queries in logs (set to false in production)
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# Hibernate dialect auto-detected, but explicit is safer
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# =====================================================================
# REDIS CONFIGURATION
# Used for (1) caching movie reads and (2) short-lived seat holds.
# If Redis is down, cache calls fall back to MySQL and booking still relies
# on the DB pessimistic lock, so the app degrades instead of failing.
# =====================================================================

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=${REDIS_TIMEOUT:500ms}

# TTL for cached movie data (Duration format)
cache.movies.ttl=${CACHE_MOVIES_TTL:10m}

# How long a user can hold seats before they are released automatically
seat-hold.ttl=${SEAT_HOLD_TTL:10m}

# =====================================================================
# KAFKA CONFIGURATION
# Booking events are written to an outbox table in the booking transaction,
# then relayed to Kafka. Set KAFKA_ENABLED=false to run without a broker:
# bookings still work and events wait in the outbox.
# =====================================================================

app.kafka.enabled=${KAFKA_ENABLED:true}
app.kafka.topics.booking-events=${KAFKA_TOPIC_BOOKING_EVENTS:booking-events}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Producer: wait for all in-sync replicas, idempotent so retries never duplicate a write,
# and fail fast (5s) instead of blocking the relay when the broker is down
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=3000
spring.kafka.producer.properties.delivery.timeout.ms=5000

# Consumers: a new consumer group starts from the beginning of the topic
spring.kafka.consumer.auto-offset-reset=earliest

# Don't hang startup if the broker is unreachable
spring.kafka.admin.fail-fast=false
spring.kafka.admin.operation-timeout=5s

# How often the outbox relay polls for unpublished events, and how many per batch
outbox.relay.interval-ms=${OUTBOX_RELAY_INTERVAL_MS:1000}
outbox.relay.batch-size=${OUTBOX_RELAY_BATCH_SIZE:100}

# =====================================================================
# JWT CONFIGURATION
# =====================================================================

# Secret key - MUST be at least 256 bits (32 chars) for HS256.
# Local dev falls back to a dev-only key; production MUST set JWT_SECRET.
jwt.secret=${JWT_SECRET:bookmyshow-super-secret-key-which-is-at-least-256-bits-long-for-hs256}
# Token validity: 86400000 ms = 24 hours
jwt.expiration=${JWT_EXPIRATION:86400000}

# =====================================================================
# LOGGING
# =====================================================================
logging.level.com.bookmyshow=${LOG_LEVEL_APP:DEBUG}
logging.level.org.springframework.security=INFO
